<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Drift — Owner Dashboard</title>
<style>
  :root{
    --bg-0:#070912; --bg-1:#0d1128;
    --player:#4bf5ff; --player-glow:#0aa8c9;
    --danger:#ff3d8b; --gem:#ffd84a; --good:#6cffb8;
    --ink:#eaf0ff; --ink-dim:#8892b8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    background:radial-gradient(ellipse at 50% 0%, var(--bg-1), var(--bg-0) 70%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
  }
  .wrap{ max-width:720px; margin:0 auto; padding:32px 20px 80px; }
  h1{ font-size:26px; font-weight:900; margin:0 0 4px; letter-spacing:-0.5px; }
  h1 span{ color:var(--player); }
  .sub{ color:var(--ink-dim); font-size:14px; margin:0 0 30px; }

  /* login */
  #loginBox{
    max-width:320px; margin:80px auto; text-align:center;
  }
  #loginBox input{
    width:100%; box-sizing:border-box;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.14);
    color:var(--ink); font-size:15px;
    padding:13px 16px; border-radius:12px; margin-bottom:10px;
    outline:none;
  }
  #loginBox input:focus{ border-color:rgba(75,245,255,0.5); }
  .btn{
    border:none; outline:none; width:100%;
    background:linear-gradient(180deg, var(--player), var(--player-glow));
    color:#03151a; font-weight:800; font-size:15px;
    padding:14px; border-radius:12px; cursor:pointer;
  }
  .btn:active{ transform:scale(0.98); }
  .btn:disabled{ opacity:0.5; }
  .err{ color:var(--danger); font-size:13px; min-height:18px; margin-top:10px; }
  .hidden{ display:none !important; }

  /* tabs */
  .tabs{ display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .tab{
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
    color:var(--ink-dim); font-weight:700; font-size:12px; letter-spacing:0.6px;
    padding:10px 16px; border-radius:100px; cursor:pointer;
  }
  .tab.active{ background:rgba(75,245,255,0.14); border-color:rgba(75,245,255,0.4); color:var(--player); }
  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; flex-wrap:wrap; }
  .ghostbtn{
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.14);
    color:var(--ink); font-size:12px; font-weight:700; padding:9px 14px;
    border-radius:10px; cursor:pointer;
  }
  .periodLabel{ color:var(--ink-dim); font-size:12px; }

  table{ width:100%; border-collapse:collapse; }
  th{
    text-align:left; font-size:11px; letter-spacing:1px; color:var(--ink-dim);
    padding:0 12px 10px; font-weight:700;
  }
  td{
    background:rgba(255,255,255,0.03);
    padding:13px 12px; font-size:14px;
    border-top:1px solid rgba(255,255,255,0.06);
  }
  tr td:first-child{ border-radius:10px 0 0 10px; }
  tr td:last-child{ border-radius:0 10px 10px 0; }
  tr.winner td{ background:rgba(255,216,74,0.08); }
  .rank{ font-weight:800; color:var(--ink-dim); width:26px; }
  tr.winner .rank{ color:var(--gem); }
  .rname{ font-weight:700; }
  .rscore{ font-weight:800; color:var(--player); font-variant-numeric:tabular-nums; }
  .rphone{ color:var(--ink-dim); font-size:12.5px; word-break:break-word; max-width:160px; }
  .paidBtn{
    background:rgba(108,255,184,0.12); border:1px solid rgba(108,255,184,0.4);
    color:var(--good); font-size:11px; font-weight:700; padding:7px 12px;
    border-radius:8px; cursor:pointer; white-space:nowrap;
  }
  .paidBtn.is-paid{ background:rgba(255,255,255,0.05); border-color:rgba(255,255,255,0.1); color:var(--ink-dim); cursor:default; }
  .empty{ color:var(--ink-dim); font-size:14px; padding:30px 0; text-align:center; }
  .signout{ color:var(--ink-dim); font-size:12px; background:none; border:none; cursor:pointer; text-decoration:underline; padding:0; }
</style>
</head>
<body>
<div class="wrap">

  <div id="loginBox">
    <h1>Neon <span>Drift</span></h1>
    <p class="sub">Owner dashboard</p>
    <input type="email" id="emailInput" placeholder="Owner email">
    <input type="password" id="passInput" placeholder="Password">
    <button class="btn" id="loginBtn">Sign in</button>
    <p class="err" id="loginErr"></p>
  </div>

  <div id="dash" class="hidden">
    <h1>Neon <span>Drift</span> — Prize Board</h1>
    <p class="sub">Pick a period, find the top score, mark the prize as paid once you've sent it. <button class="signout" id="signoutBtn">Sign out</button></p>

    <div class="tabs" id="tabs">
      <button class="tab active" data-period="week">This Week</button>
      <button class="tab" data-period="month">This Month</button>
      <button class="tab" data-period="all">All-Time</button>
    </div>

    <div class="toolbar">
      <span class="periodLabel" id="periodLabel"></span>
      <button class="ghostbtn" id="exportBtn">Export CSV</button>
    </div>

    <div id="tableWrap">
      <p class="empty">Loading…</p>
    </div>
  </div>

</div>

<script type="module">
  // Paste the SAME config you used in neon-dodge.html — see SETUP-FIREBASE.md
  const firebaseConfig = {
    apiKey: "AIzaSyAPYM9VQTunhGfUv-n9-IadiI70QtH6n_o",
    authDomain: "neon-drift-f0a66.firebaseapp.com",
    projectId: "neon-drift-f0a66",
    storageBucket: "neon-drift-f0a66.firebasestorage.app",
    messagingSenderId: "75228925101",
    appId: "1:75228925101:web:295945ec8d7681ee264a24"
  };

  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js");
  const authMod = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js");
  const fsMod = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js");

  const app = initializeApp(firebaseConfig);
  const auth = authMod.getAuth(app);
  const db = fsMod.getFirestore(app);

  const loginBox = document.getElementById('loginBox');
  const dash = document.getElementById('dash');
  const emailInput = document.getElementById('emailInput');
  const passInput = document.getElementById('passInput');
  const loginBtn = document.getElementById('loginBtn');
  const loginErr = document.getElementById('loginErr');
  const signoutBtn = document.getElementById('signoutBtn');
  const tabs = document.getElementById('tabs');
  const tableWrap = document.getElementById('tableWrap');
  const periodLabel = document.getElementById('periodLabel');
  const exportBtn = document.getElementById('exportBtn');

  let currentPeriod = 'week';
  let currentRows = [];

  loginBtn.addEventListener('click', async ()=>{
    loginErr.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in…';
    try{
      await authMod.signInWithEmailAndPassword(auth, emailInput.value.trim(), passInput.value);
    }catch(err){
      loginErr.textContent = 'Wrong email or password.';
    }
    loginBtn.disabled = false;
    loginBtn.textContent = 'Sign in';
  });

  signoutBtn.addEventListener('click', ()=> authMod.signOut(auth));

  authMod.onAuthStateChanged(auth, (user)=>{
    if(user){
      loginBox.classList.add('hidden');
      dash.classList.remove('hidden');
      loadPeriod(currentPeriod);
    } else {
      loginBox.classList.remove('hidden');
      dash.classList.add('hidden');
    }
  });

  function startOfWeekUTC(){
    const now = new Date();
    const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
    const day = d.getUTCDay();
    d.setUTCDate(d.getUTCDate() + (day===0 ? -6 : 1-day));
    d.setUTCHours(0,0,0,0);
    return d;
  }
  function startOfMonthUTC(){
    const now = new Date();
    return new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1));
  }

  tabs.addEventListener('click', (e)=>{
    const btn = e.target.closest('.tab');
    if(!btn) return;
    [...tabs.children].forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod = btn.dataset.period;
    loadPeriod(currentPeriod);
  });

  async function loadPeriod(period){
    tableWrap.innerHTML = '<p class="empty">Loading…</p>';
    const labels = {
      week: 'Winner gets the weekly prize · resets every Monday (UTC)',
      month: 'Winner gets the monthly prize · resets on the 1st (UTC)',
      all: 'All-time high scores — bragging rights only'
    };
    periodLabel.textContent = labels[period];

    try{
      const scoresRef = fsMod.collection(db, 'scores');
      let qy;
      if(period === 'all'){
        qy = fsMod.query(scoresRef, fsMod.orderBy('score','desc'), fsMod.limit(50));
      } else {
        const start = period==='week' ? startOfWeekUTC() : startOfMonthUTC();
        qy = fsMod.query(
          scoresRef,
          fsMod.where('ts','>=', fsMod.Timestamp.fromDate(start)),
          fsMod.orderBy('ts'),
          fsMod.orderBy('score','desc'),
          fsMod.limit(50)
        );
      }
      const snap = await fsMod.getDocs(qy);
      const rows = [];
      snap.forEach(d => rows.push({ id:d.id, ...d.data() }));
      rows.sort((a,b)=> b.score - a.score);
      currentRows = rows;
      renderTable(rows);
    }catch(err){
      console.error(err);
      tableWrap.innerHTML = '<p class="empty">Could not load — check the browser console (you may need to create a Firestore index; Firebase prints a direct link for that in the console error).</p>';
    }
  }

  function renderTable(rows){
    if(rows.length === 0){
      tableWrap.innerHTML = '<p class="empty">No scores in this period yet.</p>';
      return;
    }
    const body = rows.map((r,i)=>`
      <tr class="${i===0?'winner':''}">
        <td class="rank">${i+1}</td>
        <td class="rname">${escapeHtml(r.name||'Anonymous')}</td>
        <td class="rscore">${r.score}</td>
        <td class="rphone">${escapeHtml(r.phone||'—')}</td>
        <td>
          <button class="paidBtn ${r.paid?'is-paid':''}" data-id="${r.id}">
            ${r.paid ? '✓ Paid' : 'Mark Paid'}
          </button>
        </td>
      </tr>
    `).join('');
    tableWrap.innerHTML = `
      <table>
        <thead><tr>
          <th></th><th>Player</th><th>Score</th><th>Phone (mobile money)</th><th></th>
        </tr></thead>
        <tbody>${body}</tbody>
      </table>
    `;
    tableWrap.querySelectorAll('.paidBtn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        if(btn.classList.contains('is-paid')) return;
        btn.textContent = '…';
        try{
          await fsMod.updateDoc(fsMod.doc(db,'scores',btn.dataset.id), {
            paid: true,
            paidAt: fsMod.serverTimestamp()
          });
          btn.textContent = '✓ Paid';
          btn.classList.add('is-paid');
        }catch(err){
          console.error(err);
          btn.textContent = 'Mark Paid';
          alert('Could not mark as paid — check your Firestore security rules (see SETUP-FIREBASE.md).');
        }
      });
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  exportBtn.addEventListener('click', ()=>{
    if(currentRows.length === 0) return;
    const header = 'rank,name,score,phone,paid\n';
    const body = currentRows.map((r,i)=>
      [i+1, r.name||'', r.score, (r.phone||'').replace(/,/g,' '), r.paid?'yes':'no'].join(',')
    ).join('\n');
    const blob = new Blob([header+body], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `neon-drift-${currentPeriod}-${Date.now()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
